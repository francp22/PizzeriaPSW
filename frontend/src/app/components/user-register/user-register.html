<section class="register-container">

  <h2>Crea il tuo account</h2>
  <p class="subtitle">Registrati per ordinare dalla nostra pizzeria</p>

  <div class="form-group">
    <label>Nome</label>
    <input type="text" [(ngModel)]="user.name" placeholder="Inserisci il tuo nome">
  </div>

  <div class="form-group">
    <label>Cognome</label>
    <input type="text" [(ngModel)]="user.surname" placeholder="Inserisci il tuo cognome">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" [(ngModel)]="user.email" placeholder="Inserisci la tua email">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" [(ngModel)]="user.password" placeholder="Scegli una password">
  </div>

  <button (click)="register()">Registrati</button>

  <p class="login-link">
    Hai già un account?
    <a routerLink="/login">Accedi</a>
  </p>
  <a routerLink="/">← Torna al menù</a>

</section>
